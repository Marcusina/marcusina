databases:
  - name: marcusina-db
    plan: free

services:
  - type: web
    name: marcusina-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: marcusina-db
          property: connectionString
      - key: APP_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        # Comma-separated origins for any browser (Expo web) client hitting
        # this backend. Unset here on purpose - env.ts's default of
        # http://localhost:8081 would otherwise silently apply in
        # production. Set to the deployed web frontend's actual origin(s)
        # in the Render dashboard once one exists; native app traffic isn't
        # subject to CORS and doesn't need this at all.
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_HOST_SECURE
        value: "true"
      - key: EMAIL_HOST_USERNAME
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
